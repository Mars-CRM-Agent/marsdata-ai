name: Feature request
description: Suggest something Marsdata should be able to do. 提出一个功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The situation you are in 你遇到的情况
      description: >-
        Describe the relationship-maintenance problem, not the solution — what you are trying to
        keep track of and where it currently breaks down.
        请描述你遇到的关系维护问题，而不是解决方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like Marsdata to do 你希望它怎么做
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How you handle it today 你现在怎么应付
      description: Another tool, a manual habit, or simply living with it. 用别的工具、手动记录，或者就这么算了。
    validations:
      required: false
